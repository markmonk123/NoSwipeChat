server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Frontend and API routes via backend
  location /api/ {
    proxy_pass http://__BACKEND_UPSTREAM__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket support for Socket.io
  location /socket.io/ {
    proxy_pass http://__BACKEND_UPSTREAM__/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # RoBERTa embeddings service - frontend can call directly
  location /embeddings/ {
    proxy_pass http://__EMBEDDINGS_UPSTREAM__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend assets and SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
