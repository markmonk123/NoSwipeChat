server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS – defers upstream resolution to request time
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Upstream variables resolved at request time (not at startup)
  set $backend_upstream    "http://backend:5000";
  set $embeddings_upstream "http://embeddings:8000";

  # ── Security headers ────────────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"            always;
  add_header X-Content-Type-Options    "nosniff"               always;
  add_header X-XSS-Protection          "1; mode=block"         always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # NOTE: HSTS is only effective when TLS is terminated at this nginx instance.
  # In production, TLS should be terminated at a load balancer or upstream proxy
  # that forwards to this container; the HSTS header will be sent correctly to
  # browsers because the outer layer is HTTPS.

  # ── Shared proxy settings ───────────────────────────────────────────────────
  proxy_http_version    1.1;
  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── API reverse proxy ───────────────────────────────────────────────────────
  location /api/ {
    proxy_pass $backend_upstream;
  }

  # ── WebSocket / Socket.io ───────────────────────────────────────────────────
  location /socket.io/ {
    proxy_pass $backend_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  # ── Embeddings service ──────────────────────────────────────────────────────
  location /embeddings/ {
    proxy_pass       $embeddings_upstream/;
    proxy_read_timeout 120s;
  }

  # ── Static assets with long-lived cache ────────────────────────────────────
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
  }

  # ── SPA fallback ────────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Deny dot-files ──────────────────────────────────────────────────────────
  location ~ /\. {
    deny all;
    return 404;
  }

  error_page 404             /index.html;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
    internal;
  }
}
