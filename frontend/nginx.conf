server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Use resolver for DNS lookups
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  # Set variables for backend services to defer DNS resolution to request time
  set $backend_upstream "http://backend:5000";
  set $embeddings_upstream "http://embeddings:8000";

  # Frontend and API routes via backend
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket support for Socket.io
  location /socket.io/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # RoBERTa embeddings service - frontend can call directly
  location /embeddings/ {
    proxy_pass $embeddings_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend assets and SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
