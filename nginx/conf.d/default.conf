# /etc/nginx/conf.d/default.conf  –  virtual-host / reverse-proxy configuration
#
# Traffic flow:
#   Browser → nginx:8080 (external network)
#             ├─ /api/*        → backend:5000   (internal network)
#             ├─ /socket.io/*  → backend:5000   (WebSocket upgrade)
#             ├─ /embeddings/* → embeddings:8000 (internal network)
#             └─ /*            → static files   (built into this image)

server {
    listen 8080;
    server_name _;

    # ── Docker internal DNS resolver ──────────────────────────────────────────
    # 127.0.0.11 is the Docker embedded DNS server; using a variable for
    # upstream addresses defers resolution to request time so nginx starts
    # successfully even if upstream containers are not yet ready.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Upstream variables – resolved at request time, not at startup
    set $backend_upstream    "http://backend:5000";
    set $embeddings_upstream "http://embeddings:8000";

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # NOTE: HSTS is effective only when TLS terminates here. In this stack, TLS
    # terminates at an upstream load balancer/CDN; the browser receives the HSTS
    # header over the outer HTTPS connection, which is the correct behaviour.
    # Content-Security-Policy – NOTE: 'unsafe-inline' and 'unsafe-eval' are required
    # by the Expo/React Native Web bundle (inline styles + eval for dynamic imports).
    # Audit the built bundle and tighten with nonces/hashes once the build pipeline
    # supports it.  Until then these are the minimum working directives.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: ws: https://graph.facebook.com; font-src 'self' data:; frame-src https://www.facebook.com; object-src 'none'; base-uri 'self';" always;

    # ── Proxy common settings ─────────────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_buffering         on;
    proxy_buffer_size       8k;
    proxy_buffers           8 8k;

    # Forward real client info to upstream services
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API reverse proxy ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass $backend_upstream;
    }

    # ── Authentication endpoints (stricter rate limit) ─────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass $backend_upstream;
    }

    # ── WebSocket / Socket.io ─────────────────────────────────────────────────
    location /socket.io/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass $backend_upstream;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer timeouts for persistent connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Embeddings service proxy ──────────────────────────────────────────────
    location /embeddings/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass $embeddings_upstream/;

        # Longer timeout – model inference can be slow
        proxy_read_timeout 120s;
    }

    # ── Static frontend assets ────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback – serve index.html for unknown paths
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Re-apply security headers (add_header doesn't inherit in nested blocks)
            add_header X-Frame-Options        "SAMEORIGIN"  always;
            add_header X-Content-Type-Options "nosniff"     always;
        }
    }

    # ── Deny access to hidden files / dot-files ───────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Custom error pages ────────────────────────────────────────────────────
    error_page 404              /index.html;
    error_page 500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
