# ─── Network Design ───────────────────────────────────────────────────────────
#
#  noswipechat-external  (bridge, internet access)
#    └── nginx only – accepts inbound traffic from the host/internet
#
#  noswipechat-internal  (bridge, internal: true → NO internet access)
#    └── backend, embeddings, mongo – completely isolated from the internet
#        at runtime; nginx bridges both networks to route traffic inward.
#
#  Internet access during build:
#    Docker image builds always have internet access regardless of runtime
#    network settings (npm install, pip install run during `docker build`).
#    Once built, containers on noswipechat-internal cannot reach the internet.
#
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # External-facing network: nginx sits here to accept inbound requests.
  # Has a default gateway so nginx can reach the internet if needed (e.g. OAuth).
  noswipechat-external:
    driver: bridge

  # Internal-only network: no default gateway, no internet access at runtime.
  # All inter-service communication happens here.
  noswipechat-internal:
    driver: bridge
    internal: true   # <── key flag: Docker removes the default route

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: noswipechat-mongo
    # No host port binding – only reachable from the internal network
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - noswipechat-internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Node.js backend ───────────────────────────────────────────────────────────
  backend:
    image: noswipechat-backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      # `npm install --omit=dev` runs at build time when Docker has internet
      # access; the compiled image is then placed on the internal-only network.
    container_name: noswipechat-backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/singles-chatroom
      JWT_SECRET: ${JWT_SECRET:-change-me}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      EXPO_PUBLIC_FACEBOOK_APP_ID: ${EXPO_PUBLIC_FACEBOOK_APP_ID:-${FACEBOOK_APP_ID:-}}
      FRONTEND_URLS: http://localhost:8080,http://127.0.0.1:8080,${CODESPACE_PUBLIC_URL:-}
      SOCKET_IO_PATH: /socket.io
      EMBEDDINGS_SERVICE_URL: http://embeddings:8000
    restart: unless-stopped
    # Internal network only – not reachable directly from the internet
    networks:
      - noswipechat-internal
    expose:
      - "5000"

  # ── Python / RoBERTa embeddings service ──────────────────────────────────────
  embeddings:
    image: noswipechat-embeddings
    build:
      context: .
      dockerfile: ./Dockerfile
      # pip install runs at build time (internet access available);
      # the runtime container is on the internal-only network.
    container_name: noswipechat-embeddings
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Internal network only – not reachable from the internet
    networks:
      - noswipechat-internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── nginx reverse proxy ───────────────────────────────────────────────────────
  # nginx is the ONLY container on both networks:
  #   • noswipechat-external → accepts traffic from the host / internet
  #   • noswipechat-internal → can reach backend, embeddings, mongo
  nginx:
    image: noswipechat-nginx
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      # Stage 1 of the Dockerfile runs `npm ci` (internet access at build time)
      # to compile the React frontend. Stage 2 is a clean nginx image.
    container_name: noswipechat-nginx
    depends_on:
      - backend
      - embeddings
    ports:
      - "8080:8080"   # Only externally exposed port in the entire stack
    networks:
      - noswipechat-external   # Accept external traffic
      - noswipechat-internal   # Proxy to internal services
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mongo-data:
