version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: noswipechat-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - noswipechat-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: noswipechat-backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: noswipechat-backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/singles-chatroom
      JWT_SECRET: ${JWT_SECRET:-change-me}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      EXPO_PUBLIC_FACEBOOK_APP_ID: ${EXPO_PUBLIC_FACEBOOK_APP_ID:-${FACEBOOK_APP_ID:-}}
      FRONTEND_URLS: http://localhost:8080,http://127.0.0.1:8080
      SOCKET_IO_PATH: /socket.io
      # RoBERTa embeddings service endpoint (internal network)
      EMBEDDINGS_SERVICE_URL: http://embeddings:8000
    restart: unless-stopped
    networks:
      - noswipechat-network
    expose:
      - "5000"

  embeddings:
    image: noswipechat-embeddings
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: noswipechat-embeddings
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - noswipechat-network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: noswipechat-nginx
    depends_on:
      - backend
      - embeddings
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - noswipechat-network
    restart: unless-stopped
    command: /bin/sh -c "sed -i 's|__BACKEND_UPSTREAM__|backend:5000|g' /etc/nginx/conf.d/default.conf && sed -i 's|__EMBEDDINGS_UPSTREAM__|embeddings:8000|g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

volumes:
  mongo-data:

networks:
  noswipechat-network:
    driver: bridge
